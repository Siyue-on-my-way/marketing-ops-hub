<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maitian Hub · 门户</title>
<style>
  :root { --bg:#101318; --panel:#181d24; --line:#262d38; --text:#e6e9ee; --dim:#8b93a1; --accent:#4f8cff; --ok:#3fbf7f; --bad:#e05c5c; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
  header { display:flex; align-items:baseline; gap:14px; padding:14px 20px; border-bottom:1px solid var(--line); }
  header h1 { font-size:16px; margin:0; }
  header .sub { color:var(--dim); font-size:12px; }
  header .right { margin-left:auto; display:flex; gap:10px; align-items:center; }
  main { padding:16px 20px 40px; max-width:1100px; margin:0 auto; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:14px; }
  .panel h2 { margin:0 0 12px; font-size:14px; color:var(--dim); }
  .authbox { max-width:400px; margin:60px auto; }
  .authbox .tabs { display:flex; gap:6px; margin-bottom:14px; }
  .authbox .tabs button { flex:1; }
  input, button, select { font:inherit; }
  input { width:100%; background:var(--bg); border:1px solid var(--line); color:var(--text); padding:8px 10px; border-radius:6px; margin-bottom:10px; }
  button { background:var(--accent); border:0; color:#fff; padding:7px 14px; border-radius:6px; cursor:pointer; font-size:13px; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--dim); }
  button.danger { background:transparent; border:1px solid var(--bad); color:var(--bad); }
  button:disabled { opacity:.4; cursor:default; }
  .err { color:var(--bad); font-size:12px; margin:6px 0; min-height:16px; }
  .okmsg { color:var(--ok); font-size:12px; margin:6px 0; word-break:break-all; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--dim); font-weight:500; }
  .meta { color:var(--dim); font-size:12px; }
  .badge { display:inline-block; padding:1px 8px; border-radius:10px; font-size:11px; background:var(--line); color:var(--dim); margin-right:4px; }
  .empty { color:var(--dim); text-align:center; padding:14px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .link { color:var(--accent); cursor:pointer; word-break:break-all; }
  pre.key { background:var(--bg); border:1px dashed var(--accent); border-radius:6px; padding:10px; word-break:break-all; user-select:all; }
  nav.tabs { display:flex; gap:4px; padding:10px 20px 0; }
  nav.tabs button { background:none; border:1px solid transparent; color:var(--dim); padding:6px 14px; border-radius:8px 8px 0 0; }
  nav.tabs button.active { color:var(--text); background:var(--panel); border-color:var(--line); }
  td.kc { white-space:nowrap; }
  td.kc button { visibility:hidden; }
  tr:hover td.kc button, td.kc:hover button { visibility:visible; }
  #f-list td.kc button { visibility:visible; }  /* 素材管理操作常显（管理页入口不可藏） */
  /* ---- 素材库：上传与管理 ---- */
  .dropzone { border:1px dashed var(--line); border-radius:8px; padding:18px 10px; text-align:center; color:var(--dim); cursor:pointer; transition:border-color .15s, background .15s; margin-bottom:10px; }
  .dropzone:hover, .dropzone.drag { border-color:var(--accent); background:rgba(79,140,255,.06); color:var(--text); }
  .chips { display:flex; gap:6px; flex-wrap:wrap; }
  .chip { border:1px solid var(--line); background:var(--bg); color:var(--dim); border-radius:14px; padding:3px 12px; font-size:12px; cursor:pointer; user-select:none; }
  .chip.on { border-color:var(--accent); color:var(--accent); background:rgba(79,140,255,.12); }
  .chip.label { cursor:default; color:var(--dim); border-style:dashed; }
  .u-file { display:flex; gap:8px; align-items:center; padding:5px 0; border-bottom:1px dashed var(--line); font-size:13px; }
  .u-file input { margin:0; flex:1; max-width:340px; }
  .u-file .meta { flex-shrink:0; }
  .u-file button { flex-shrink:0; padding:3px 10px; font-size:12px; }
  .progress { height:6px; background:var(--bg); border:1px solid var(--line); border-radius:4px; overflow:hidden; margin-top:8px; }
  .progress > div { height:100%; width:0; background:var(--accent); transition:width .2s; }
  .thumb { width:52px; height:36px; object-fit:cover; border-radius:4px; background:var(--bg); border:1px solid var(--line); flex-shrink:0; }
  .thumb.ph { display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--dim); }
  .modal-mask { position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:flex-start; justify-content:center; padding:40px 16px; overflow-y:auto; z-index:50; }
  .modal { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:18px; width:100%; max-width:640px; }
  .modal h3 { margin:0 0 12px; font-size:15px; }
  .modal .preview { margin-bottom:12px; max-height:340px; display:flex; justify-content:center; background:var(--bg); border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .modal .preview img, .modal .preview video { max-width:100%; max-height:340px; object-fit:contain; }
  .modal .preview pre { margin:0; padding:12px; width:100%; max-height:340px; overflow:auto; font-size:12px; color:var(--dim); white-space:pre-wrap; word-break:break-all; }
  .modal dl { display:grid; grid-template-columns:76px 1fr; gap:4px 10px; font-size:13px; margin:0 0 12px; }
  .modal dt { color:var(--dim); }
  .modal dd { margin:0; word-break:break-all; }
  textarea { width:100%; background:var(--bg); border:1px solid var(--line); color:var(--text); padding:8px 10px; border-radius:6px; font:inherit; resize:vertical; min-height:56px; margin-bottom:10px; }
</style>
</head>
<body>
<header>
  <h1>Maitian Hub · 门户</h1>
  <span class="sub" id="wsname"></span>
  <div class="right" id="userbox"></div>
</header>
<div id="app"></div>
<div class="toast" id="toast" style="position:fixed;right:20px;bottom:20px;background:var(--panel);border:1px solid var(--line);padding:10px 16px;border-radius:8px;display:none;"></div>
<script>
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => Array.from(el.querySelectorAll(s));
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const INVITE = new URLSearchParams(location.search).get('invite') || '';
let ME = null;
const PLATS = [['common','common'],['xhs','小红书'],['douyin','抖音'],['tiktok','TikTok'],['yt','YouTube'],['bili','B站'],['x','X'],['xianyu','闲鱼']];
const TYPE_NAMES = { video:'视频', image:'图片', text:'文案' };
const extType = (name) => {
  const ext = (/\.([a-z0-9]+)$/i.exec(name || '')?.[1] || '').toLowerCase();
  if (['mp4','mov','avi','mkv','webm','m4v','flv','wmv','ts','3gp','mpeg','mpg'].includes(ext)) return 'video';
  if (['jpg','jpeg','png','gif','webp','bmp','heic','heif','svg','tif','tiff','ico'].includes(ext)) return 'image';
  return 'text';
};
const fmtSize = (n) => n >= 1024 * 1024 * 1024 ? (n / 1024 / 1024 / 1024).toFixed(2) + 'GB' : n >= 1024 * 1024 ? (n / 1024 / 1024).toFixed(2) + 'MB' : (n / 1024).toFixed(1) + 'KB';

function toast(msg, ok=true) { const t=$('#toast'); t.textContent=msg; t.style.borderColor=ok?'var(--ok)':'var(--bad)'; t.style.display='block'; setTimeout(()=>t.style.display='none',4000); }
// 复制到剪贴板：HTTP 环境无 navigator.clipboard，回退 execCommand
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; } catch {}
  try {
    const ta = document.createElement('textarea');
    ta.value = t; ta.style.cssText = 'position:fixed;top:-999px;opacity:0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    const ok = document.execCommand('copy');
    ta.remove(); return ok;
  } catch { return false; }
}
async function api(path, opts={}) {
  const o = { ...opts, headers: { ...(opts.headers||{}) } };
  if (o.body && !(o.body instanceof FormData) && typeof o.body !== 'string') { o.body = JSON.stringify(o.body); o.headers['content-type']='application/json'; }
  const r = await fetch(path, o);
  let j; try { j = await r.json(); } catch { j = { ok:false, error:'bad response' }; }
  if (r.status === 401 && ME) { ME = null; render(); }
  return { status: r.status, ...j };
}
function pwCheck(p) { return String(p||'').length >= 8 ? null : '密码至少 8 位'; }
function unCheck(u) { return /^[A-Za-z0-9_\-]{3,32}$/.test(u||'') ? null : '用户名 3-32 位（字母/数字/_/-）'; }

// ---------- 认证视图 ----------
function renderAuth(mode) {
  $('#userbox').innerHTML = '';
  $('#wsname').textContent = '';
  const inv = INVITE ? `<div class="meta">已检测到邀请链接：将加入邀请方的 workspace</div><input id="i-inv" value="${esc(INVITE)}" readonly>` : '';
  $('#app').innerHTML = `<div class="authbox panel">
    <div class="tabs"><button id="t-login">登录</button><button id="t-reg">注册</button></div>
    <div class="err" id="a-err"></div>
    ${mode==='reg' ? inv : ''}
    <input id="i-user" placeholder="邮箱或手机号" autocomplete="username">
    <input id="i-pass" type="password" placeholder="密码（≥8 位）" autocomplete="${mode==='reg'?'new-password':'current-password'}">
    ${mode==='reg' ? '<input id="i-pass2" type="password" placeholder="再次输入密码（两次需一致）">' : ''}
    <button id="a-go" style="width:100%">${mode==='reg' ? (INVITE?'加入该 workspace 并注册':'注册（创建我的 workspace）') : '登录'}</button>
    <div class="meta" style="margin-top:10px">注册即创建自己的 workspace（注册人=拥有者）；持邀请链接注册则加入对方 workspace。CLI 用「密钥管理」页的默认密钥连接。</div>
  </div>`;
  $('#t-login').onclick = () => renderAuth('login');
  $('#t-reg').onclick = () => renderAuth('reg');
  $('#a-go').onclick = async () => {
    const err = $('#a-err'); err.textContent = '';
    const account = $('#i-user').value.trim(), password = $('#i-pass').value;
    if (!account) { err.textContent = '请输入邮箱或手机号'; return; }
    if (mode === 'reg') {
      const e2 = pwCheck(password); if (e2) { err.textContent = e2; return; }
      if (password !== $('#i-pass2').value) { err.textContent = '两次输入的密码不一致'; return; }
      const invite = ($('#i-inv') && $('#i-inv').value.trim()) || '';
      const r = await api('/webapi/register', { method:'POST', body:{ account, password, password2: $('#i-pass2').value, invite_code: invite || undefined } });
      if (!r.ok) { err.textContent = r.error || '注册失败'; return; }
      ME = { username: r.account, role: r.role, tenant_id: r.tenant_id, tenant_name: r.tenant_name };
      showKeyOnce(r.api_key);
    } else {
      const r = await api('/webapi/login', { method:'POST', body:{ account, password } });
      if (!r.ok) { err.textContent = r.error || '登录失败'; return; }
      ME = { username: r.username, role: r.role, tenant_id: r.tenant_id, tenant_name: r.tenant_name };
    }
    render();
  };
}
function showKeyOnce(key) {
  $('#app').insertAdjacentHTML('afterbegin', `<div class="panel"><h2>你的默认 API 密钥（仅此一次显示，请立即复制保存）</h2><pre class="key">${esc(key)}</pre>
  <div class="meta">CLI 连接：在 hub 所在机器执行 <code>node src/hub.mjs join</code> 并粘贴此密钥。此页可随时新建更多密钥；之后也可在「密钥管理」列表点「复制」随时取回。</div>
  <div class="row"><button id="sk-copy">复制密钥</button><button class="ghost" onclick="this.closest('.panel').remove()">我已保存</button></div></div>`);
  $('#sk-copy').onclick = async () => { const ok = await copyText(key); toast(ok ? '已复制到剪贴板' : '复制失败，请手动选中复制', ok); };
}

// ---------- 主视图 ----------
function render() {
  if (!ME) return renderAuth(INVITE ? 'reg' : 'login');
  $('#userbox').innerHTML = `<span class="sub">${esc(ME.username)}（${ME.role==='owner'?'拥有者':'成员'}）</span><button class="ghost" id="b-logout">退出</button>`;
  $('#wsname').textContent = 'workspace：' + (ME.tenant_name || '');
  $('#b-logout').onclick = async () => { await api('/webapi/logout', { method:'POST', body:{} }); ME = null; render(); };
  $('#app').innerHTML = `<nav class="tabs">
      <button data-t="mat" class="active">素材库</button>
      <button data-t="keys">密钥管理</button>
      <button data-t="inv">邀请</button>
      <button data-t="mem">成员</button>
    </nav><main id="main"></main>`;
  $$('#app nav.tabs button').forEach((b) => b.onclick = () => {
    $$('#app nav.tabs button').forEach((x) => x.classList.remove('active')); b.classList.add('active'); renderTab(b.dataset.t);
  });
  renderTab('mat');
}
function renderTab(t) {
  const main = $('#main');
  if (t === 'mat') renderMaterials(main);
  else if (t === 'keys') renderKeys(main);
  else if (t === 'inv') renderInvite(main);
  else renderMembers(main);
}

// ---------- 素材库：网页上传 / 查看 / 管理 ----------
function chipRow(name, selected = []) {
  return `<div class="chips" data-chips="${name}">` + PLATS.map(([v, n]) =>
    `<span class="chip ${selected.includes(v) ? 'on' : ''}" data-v="${v}">${esc(n)}</span>`).join('') + '</div>';
}
function chipVals(el) { return $$('.chip.on', el).map((c) => c.dataset.v); }
function bindChips(el) { $$('.chip', el).forEach((c) => c.onclick = () => c.classList.toggle('on')); }

function openModal(html) {
  closeModal();
  const mask = document.createElement('div');
  mask.className = 'modal-mask'; mask.id = 'modal';
  mask.innerHTML = `<div class="modal">${html}</div>`;
  mask.onclick = (e) => { if (e.target === mask) closeModal(); };
  document.body.appendChild(mask);
  return mask;
}
function closeModal() { const el = $('#modal'); if (el) el.remove(); }

function matFileUrl(id) { return `/webapi/materials/${esc(id)}/file`; }

function previewHtml(m, fileUrl) {
  if (m.type === 'image') return `<img src="${fileUrl}" alt="${esc(m.title)}">`;
  if (m.type === 'video') return `<video src="${fileUrl}" controls preload="metadata"></video>`;
  if (m.type === 'text') return `<pre id="pv-text">加载中…</pre>`;
  return `<div class="empty">暂不支持预览，请下载查看</div>`;
}
async function loadTextPreview(fileUrl) {
  try {
    const t = await (await fetch(fileUrl)).text();
    const el = $('#pv-text');
    if (el) el.textContent = t.length > 4000 ? t.slice(0, 4000) + '\n…（已截断，完整内容请下载）' : t;
  } catch { const el = $('#pv-text'); if (el) el.textContent = '预览加载失败，请下载查看'; }
}

function thumbHtml(m) {
  const fileUrl = matFileUrl(m.id);
  if (m.type === 'image') return `<img class="thumb" src="${fileUrl}" loading="lazy" alt="">`;
  if (m.type === 'video') return `<div class="thumb ph">▶</div>`;
  return `<div class="thumb ph">${esc((TYPE_NAMES[m.type] || m.type || '?').slice(0, 2))}</div>`;
}

function renderDetail(m) {
  const fileUrl = matFileUrl(m.id);
  const claimed = m.claimed_until && new Date(m.claimed_until) > new Date();
  const usedRows = (m.used_on || []).map((u) =>
    `<div class="meta">${esc(u.platform)} · ${esc((u.ts || '').slice(0, 16)).replace('T', ' ')}${u.url ? ` · <a class="link" href="${esc(u.url)}" target="_blank" rel="noopener">链接</a>` : ''}${u.account_id ? ' · ' + esc(u.account_id) : ''}</div>`).join('') || '<div class="meta">尚未使用</div>';
  openModal(`
    <h3>${esc(m.title)}</h3>
    <div class="preview" id="pv-box">${previewHtml(m, fileUrl)}</div>
    <dl>
      <dt>类型</dt><dd><span class="badge">${esc(TYPE_NAMES[m.type] || m.type)}</span></dd>
      <dt>平台标签</dt><dd>${m.tags.map((t) => `<span class="badge">${esc(t)}</span>`).join('')}</dd>
      <dt>大小</dt><dd class="meta">${fmtSize(m.size)}</dd>
      <dt>上传时间</dt><dd class="meta">${esc((m.created_at || '').slice(0, 19)).replace('T', ' ')}</dd>
      <dt>sha256</dt><dd class="meta" title="${esc(m.sha256 || '')}">${esc((m.sha256 || '').slice(0, 16))}…</dd>
      <dt>备注</dt><dd>${m.note ? esc(m.note) : '<span class="meta">—</span>'}</dd>
      <dt>占用</dt><dd class="meta">${claimed ? '被 ' + esc(m.claimed_by || '') + ' 占用（' + esc(m.claimed_until.slice(0, 16)).replace('T', ' ') + ' 到期）' : '空闲'}</dd>
      <dt>使用记录</dt><dd>${usedRows}</dd>
    </dl>
    <div class="row">
      <a href="${fileUrl}" target="_blank"><button>下载</button></a>
      ${claimed ? `<button class="ghost" id="d-release">释放占用</button>` : ''}
      <button class="ghost" id="d-edit">编辑</button>
      <button class="danger" id="d-del">删除</button>
      <button class="ghost" id="d-close">关闭</button>
    </div>`);
  if (m.type === 'text') loadTextPreview(fileUrl);
  $('#d-close').onclick = closeModal;
  if (claimed) $('#d-release').onclick = async () => {
    const r = await api(`/webapi/materials/${m.id}/release`, { method: 'POST', body: {} });
    toast(r.ok ? '已释放占用' : (r.error || '失败'), r.ok);
    if (r.ok) { closeModal(); renderMaterials($('#main')); }
  };
  $('#d-edit').onclick = () => renderEdit(m);
  $('#d-del').onclick = () => delMaterial(m, () => { closeModal(); renderMaterials($('#main')); });
}

function renderEdit(m) {
  openModal(`
    <h3>编辑素材</h3>
    <div class="err" id="e-err"></div>
    <input id="e-title" value="${esc(m.title)}" placeholder="标题">
    <div class="meta" style="margin-bottom:4px">平台标签（可发平台；common = 全平台）</div>
    ${chipRow('edit', m.tags)}
    <div style="margin-top:10px"><textarea id="e-note" placeholder="备注（选填）">${esc(m.note || '')}</textarea></div>
    <div class="row"><button id="e-save">保存</button><button class="ghost" id="e-cancel">取消</button></div>`);
  bindChips($('[data-chips="edit"]'));
  $('#e-cancel').onclick = closeModal;
  $('#e-save').onclick = async () => {
    const title = $('#e-title').value.trim();
    const tags = chipVals($('[data-chips="edit"]'));
    if (!title) { $('#e-err').textContent = '标题不能为空'; return; }
    if (!tags.length) { $('#e-err').textContent = '请至少选择一个平台标签'; return; }
    const r = await api(`/webapi/materials/${m.id}`, { method: 'PATCH', body: { title, platform_tags: tags, note: $('#e-note').value.trim() } });
    if (!r.ok) { $('#e-err').textContent = r.error || '保存失败'; return; }
    toast('已保存'); closeModal(); renderMaterials($('#main'));
  };
}

function delMaterial(m, after) {
  if (!confirm(`删除素材「${m.title}」？\n删除后下载链接立即失效（已发布的内容不受影响，hub 本地缓存不回收）。`)) return;
  api(`/webapi/materials/${m.id}`, { method: 'DELETE', body: {} }).then((r) => {
    toast(r.ok ? '已删除' : (r.error || '删除失败'), r.ok);
    if (r.ok && after) after();
  });
}

async function renderMaterials(main) {
  const typeInfer = (f) => extType(f.name);
  let picked = []; // {file, title}
  main.innerHTML = `
    <div class="panel">
      <h2>上传素材</h2>
      <div class="dropzone" id="u-drop">点击选择文件，或把文件拖到这里（可多选；≤500MB/个）</div>
      <input type="file" id="u-file" multiple style="display:none">
      <div id="u-files"></div>
      <div class="meta" style="margin:8px 0 4px">平台标签（可发平台；common = 全平台可用）</div>
      ${chipRow('upl', ['common'])}
      <div style="margin-top:10px"><input id="u-note" placeholder="备注（选填，本批共用）" style="margin-bottom:0"></div>
      <div class="row" style="margin-top:10px">
        <button id="u-go" disabled>开始上传</button>
        <span class="meta" id="u-state"></span>
      </div>
      <div class="progress" id="u-bar" style="display:none"><div></div></div>
      <div class="okmsg" id="u-out"></div>
    </div>
    <div class="panel">
      <h2>素材库</h2>
      <div class="row"><input id="f-q" placeholder="标题搜索…" style="max-width:260px"><select id="f-p" style="max-width:160px"></select><button id="f-go">查询</button><button class="ghost" id="f-refresh">刷新</button></div>
      <div id="f-list" class="empty">加载中…</div>
      <div class="row" style="margin-top:10px;justify-content:center"><button class="ghost" id="f-more" style="display:none">加载更多</button></div>
    </div>`;
  // 平台筛选下拉
  const sel = $('#f-p');
  for (const [code, name] of [['','全部平台'], ...PLATS]) {
    const o = document.createElement('option'); o.value = code; o.textContent = code ? name : '全部平台'; sel.appendChild(o);
  }
  // ---- 上传交互 ----
  bindChips($('[data-chips="upl"]'));
  const drop = $('#u-drop'), fileInput = $('#u-file');
  const drawPicked = () => {
    $('#u-files').innerHTML = picked.map((p, i) => `
      <div class="u-file">
        <span class="badge">${esc(TYPE_NAMES[p.type])}</span>
        <input data-ti="${i}" value="${esc(p.title)}" title="标题（上传后可再编辑）">
        <span class="meta">${fmtSize(p.file.size)}</span>
        <button class="ghost" data-rm="${i}">移除</button>
      </div>`).join('');
    $('#u-go').disabled = !picked.length;
    $$('#u-files input[data-ti]').forEach((inp) => inp.oninput = () => { picked[Number(inp.dataset.ti)].title = inp.value; });
    $$('#u-files button[data-rm]').forEach((b) => b.onclick = () => { picked.splice(Number(b.dataset.rm), 1); drawPicked(); });
  };
  const addFiles = (list) => {
    for (const f of list) {
      if (f.size > 500 * 1024 * 1024) { toast(`「${f.name}」超过 500MB，已跳过`, false); continue; }
      picked.push({ file: f, title: f.name.replace(/\.[^.]+$/, '') || f.name, type: typeInfer(f) });
    }
    drawPicked();
  };
  drop.onclick = () => fileInput.click();
  fileInput.onchange = () => { addFiles(fileInput.files); fileInput.value = ''; };
  drop.ondragover = (e) => { e.preventDefault(); drop.classList.add('drag'); };
  drop.ondragleave = () => drop.classList.remove('drag');
  drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove('drag'); addFiles(e.dataTransfer.files); };

  const bar = $('#u-bar'), barIn = bar.firstElementChild;
  const xhrUpload = (p, tags, note) => new Promise((resolve) => {
    const fd = new FormData();
    fd.append('file', p.file, p.file.name);
    fd.append('title', p.title);
    fd.append('type', p.type);
    fd.append('platform_tags', JSON.stringify(tags));
    if (note) fd.append('note', note);
    const xhr = new XMLHttpRequest();
    xhr.open('POST', '/webapi/materials');
    xhr.upload.onprogress = (e) => { if (e.lengthComputable) barIn.style.width = Math.round((e.loaded / e.total) * 100) + '%'; };
    xhr.onload = () => { let j = {}; try { j = JSON.parse(xhr.responseText); } catch {} resolve(j); };
    xhr.onerror = () => resolve({ ok: false, error: '网络错误' });
    xhr.send(fd);
  });

  $('#u-go').onclick = async () => {
    const tags = chipVals($('[data-chips="upl"]'));
    if (!tags.length) { toast('请至少选择一个平台标签', false); return; }
    if (picked.some((p) => !p.title.trim())) { toast('有文件的标题为空', false); return; }
    const note = $('#u-note').value.trim();
    const btn = $('#u-go'); btn.disabled = true;
    bar.style.display = 'block';
    const results = [];
    for (let i = 0; i < picked.length; i++) {
      $('#u-state').textContent = `上传中 ${i + 1}/${picked.length}：${picked[i].file.name}`;
      barIn.style.width = '0';
      results.push(await xhrUpload(picked[i], tags, note));
    }
    bar.style.display = 'none'; barIn.style.width = '0';
    $('#u-state').textContent = '';
    btn.disabled = false;
    const okCount = results.filter((r) => r.ok && !r.dedup).length;
    const dupCount = results.filter((r) => r.ok && r.dedup).length;
    const bad = results.filter((r) => !r.ok);
    if (bad.length) $('#u-out').textContent = bad.map((b) => b.error || '上传失败').join('；');
    else $('#u-out').textContent = '';
    let msg = `上传完成：成功 ${okCount} 条` + (dupCount ? `，去重跳过 ${dupCount} 条（相同文件已存在）` : '');
    toast(msg + (bad.length ? `；失败 ${bad.length} 条` : ''), !bad.length);
    picked = []; drawPicked();
    load();
  };

  // ---- 列表（分页 + 操作） ----
  let offset = 0, allRows = [];
  const rowHtml = (mt) => {
    const claimed = mt.claimed_until && new Date(mt.claimed_until) > new Date();
    return `<tr data-id="${esc(mt.id)}">
      <td>${thumbHtml(mt)}</td>
      <td><span class="link mat-title">${esc(mt.title)}</span></td>
      <td><span class="badge">${esc(TYPE_NAMES[mt.type] || mt.type)}</span></td>
      <td>${mt.tags.map((t) => `<span class="badge">${esc(t)}</span>`).join('')}</td>
      <td class="meta">${fmtSize(mt.size)}</td>
      <td class="meta">${esc((mt.created_at || '').slice(0, 10))}</td>
      <td class="meta">${(mt.used_on || []).length ? mt.used_on.map((u2) => `${esc(u2.platform)}${u2.url ? ' ✓' : ''}`).join('、') : '—'}</td>
      <td class="meta">${claimed ? '被 ' + esc(mt.claimed_by || '') + ' 占用' : '空闲'}</td>
      <td class="kc" style="white-space:nowrap">
        <button class="ghost" data-act="view">查看</button>
        <button class="ghost" data-act="edit">编辑</button>
        <a href="${matFileUrl(mt.id)}" target="_blank"><button class="ghost">下载</button></a>
        <button class="danger" data-act="del">删除</button>
      </td></tr>`;
  };
  const drawTable = () => {
    const list = $('#f-list');
    list.innerHTML = '<table><tr><th></th><th>标题</th><th>类型</th><th>标签</th><th>大小</th><th>时间</th><th>使用记录</th><th>占用</th><th></th></tr>' +
      allRows.map(rowHtml).join('') + '</table>';
    const byId = Object.fromEntries(allRows.map((mt) => [mt.id, mt]));
    $$('#f-list tr[data-id]').forEach((tr) => {
      const mt = byId[tr.dataset.id];
      if (!mt) return;
      $('.mat-title', tr).onclick = () => renderDetail(mt);
      $(`[data-act="view"]`, tr).onclick = () => renderDetail(mt);
      $(`[data-act="edit"]`, tr).onclick = () => renderEdit(mt);
      $(`[data-act="del"]`, tr).onclick = () => delMaterial(mt, () => load());
    });
    $('#f-more').style.display = allRows.length >= offset + 50 && lastFetch === 50 ? 'block' : 'none';
  };
  let lastFetch = 0;
  const load = async (append = false) => {
    const q = $('#f-q').value.trim(), p = sel.value;
    if (!append) { offset = 0; allRows = []; }
    const r = await api(`/webapi/materials?limit=50&offset=${offset}${p ? `&platform=${p}` : ''}${q ? `&q=${encodeURIComponent(q)}` : ''}`);
    const list = $('#f-list');
    if (!r.ok) { list.className = 'err'; list.textContent = r.error || '加载失败'; return; }
    const rows = r.items || [];
    lastFetch = rows.length;
    allRows = allRows.concat(rows);
    if (!allRows.length) { list.className = 'empty'; list.textContent = '暂无素材——在上方选择文件即可直接上传，或用 hub / API 上传后这里可见'; $('#f-more').style.display = 'none'; return; }
    list.className = '';
    drawTable();
  };
  $('#f-go').onclick = () => load();
  $('#f-refresh').onclick = () => load();
  $('#f-q').onkeydown = (e) => { if (e.key === 'Enter') load(); };
  sel.onchange = () => load();
  $('#f-more').onclick = () => { offset += 50; load(true); };
  await load();
}

async function renderKeys(main) {
  const r = await api('/webapi/me/keys');
  main.innerHTML = `<div class="panel"><h2>我的 API 密钥（CLI 用：node src/hub.mjs join 粘贴）</h2><div id="k-new"></div><div id="k-list"></div></div>`;
  const draw = (rows) => {
    $('#k-list').innerHTML = rows.length ? '<table><tr><th>名称</th><th>密钥</th><th>创建</th><th>最近使用</th><th>状态</th><th></th></tr>' +
      rows.map((k) => {
        const isDefault = k.name === '默认密钥';
        const copyBtn = (!k.revoked_at && k.revealable) ? `<button class="ghost" data-rid="${esc(k.id)}" title="点击复制完整密钥">复制</button>` : '';
        const legacyTag = (!k.revoked_at && !k.revealable) ? ' <span class="meta" title="旧版创建，明文未入库">不可回显</span>' : '';
        const revokeCell = k.revoked_at ? '' : (isDefault
          ? '<span class="meta" title="默认密钥不可吊销；如需更换请先新建其他密钥">不可吊销</span>'
          : `<button class="danger" data-id="${esc(k.id)}">吊销</button>`);
        return `<tr><td>${esc(k.name)}</td><td class="meta kc">${esc(k.key_hint||'')}${copyBtn}${legacyTag}</td><td class="meta">${esc((k.created_at||'').slice(0,10))}</td>
      <td class="meta">${k.last_used_at ? esc(k.last_used_at.slice(0,16)).replace('T',' ') : '从未'}</td>
      <td>${k.revoked_at ? '<span class="badge">已吊销</span>' : '<span class="badge" style="color:var(--ok)">有效</span>'}</td>
      <td>${revokeCell}</td></tr>`;
      }).join('') + '</table>'
      : '<div class="empty">暂无密钥</div>';
    $$('#k-list button.danger').forEach((b) => b.onclick = async () => {
      if (!confirm('吊销后使用该密钥的设备立即失联，确认？')) return;
      const rr = await api('/webapi/me/keys/' + b.dataset.id, { method:'DELETE', body:{} });
      toast(rr.ok ? '已吊销' : (rr.error||'失败'), rr.ok); renderKeys(main);
    });
    $$('#k-list button[data-rid]').forEach((b) => b.onclick = async () => {
      const rr = await api('/webapi/me/keys/' + b.dataset.rid + '/reveal');
      if (!rr.ok) { toast(rr.error || '回显失败', false); return; }
      const ok = await copyText(rr.api_key);
      toast(ok ? '密钥已复制到剪贴板' : '复制失败，请手动复制：' + rr.api_key, ok);
      if (ok) b.textContent = '✓ 已复制'; setTimeout(() => { b.textContent = '复制'; }, 1500);
    });
  };
  draw(r.keys || []);
  $('#k-new').innerHTML = `<div class="row" style="margin-bottom:10px"><input id="k-name" placeholder="密钥名称（如：服务器hub / 张三-笔记本）" style="max-width:300px"><button id="k-create">新建密钥</button></div><div class="okmsg" id="k-out"></div>`;
  $('#k-create').onclick = async () => {
    const name = $('#k-name').value.trim() || '未命名密钥';
    const rr = await api('/webapi/me/keys', { method:'POST', body:{ name } });
    if (!rr.ok) { toast(rr.error||'创建失败', false); return; }
    $('#k-out').innerHTML = '新密钥（<b>仅此一次显示，立即复制</b>）：<pre class="key">' + esc(rr.api_key) + '</pre><div class="row"><button id="k-copy">复制密钥</button></div>';
    $('#k-copy').onclick = async () => { const ok = await copyText(rr.api_key); toast(ok ? '已复制到剪贴板' : '复制失败，请手动选中复制', ok); };
    draw(rr.keys);
  };
}

async function renderInvite(main) {
  const r = await api('/webapi/me/invite');
  const link = r.invite_code ? `${location.origin}/?invite=${encodeURIComponent(r.invite_code)}` : null;
  main.innerHTML = `<div class="panel"><h2>邀请加入本 workspace</h2>
    <div class="meta" style="margin-bottom:10px">把下面的链接发给对方：对方打开即进入本 workspace 的注册页（注册后成为成员，默认获得一把自己的 API 密钥）。${ME.role==='owner'?'':'（你是成员，也可邀请；owner 可移除成员）'}</div>
    ${link ? `<pre class="key">${esc(link)}</pre><div class="row"><button class="ghost" id="iv-copy">复制链接</button><button class="ghost" id="iv-new">重新生成</button><span class="meta">有效期 7 天，限 ${r.max_uses||1} 人使用，已用 ${r.used_count||0} 次</span></div>` : '<div class="empty">生成中…</div>'}
  </div>`;
  if (link) {
    $('#iv-copy').onclick = async () => { const ok = await copyText(link); toast(ok ? '已复制' : '复制失败，请手动选中复制', ok); };
    $('#iv-new').onclick = async () => { await api('/webapi/me/invite', { method:'POST', body:{} }); renderInvite(main); };
  }
}

async function renderMembers(main) {
  const r = await api('/webapi/members');
  main.innerHTML = `<div class="panel"><h2>成员（workspace：${esc(ME.tenant_name||'')}）</h2><div id="m-list"></div></div>`;
  const rows = r.members || [];
  $('#m-list').innerHTML = rows.length ? '<table><tr><th>用户名</th><th>角色</th><th>密钥数</th><th>加入时间</th><th></th></tr>' +
    rows.map((u) => `<tr><td>${esc(u.username)}</td><td>${u.role==='owner'?'<span class="badge" style="color:var(--ok)">拥有者</span>':'<span class="badge">成员</span>'}</td>
    <td class="meta">${u.key_count}</td><td class="meta">${esc((u.created_at||'').slice(0,10))}</td>
    <td>${(ME.role==='owner' && u.role!=='owner') ? `<button class="danger" data-id="${esc(u.id)}">移除</button>` : ''}</td></tr>`).join('') + '</table>'
    : '<div class="empty">加载中…</div>';
  $$('#m-list button.danger').forEach((b) => b.onclick = async () => {
    if (!confirm('移除该成员？其全部 API 密钥将立即失效。')) return;
    const rr = await api('/webapi/members/' + b.dataset.id, { method:'DELETE', body:{} });
    toast(rr.ok ? '已移除' : (rr.error||'失败'), rr.ok); renderMembers(main);
  });
}

// ---------- 启动：用已有会话 cookie 恢复登录态（刷新不掉线）----------
(async function boot() {
  try {
    const r = await api('/webapi/me');
    if (r.ok) ME = { username: r.username, role: r.role, tenant_id: r.tenant_id, tenant_name: r.tenant_name };
  } catch { /* 网络异常/未登录 → 登录页 */ }
  render();
})();
</script>
