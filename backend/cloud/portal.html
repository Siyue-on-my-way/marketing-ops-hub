<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maitian Hub · 门户</title>
<style>
  :root { --bg:#101318; --panel:#181d24; --line:#262d38; --text:#e6e9ee; --dim:#8b93a1; --accent:#4f8cff; --ok:#3fbf7f; --bad:#e05c5c; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
  header { display:flex; align-items:baseline; gap:14px; padding:14px 20px; border-bottom:1px solid var(--line); }
  header h1 { font-size:16px; margin:0; }
  header .sub { color:var(--dim); font-size:12px; }
  header .right { margin-left:auto; display:flex; gap:10px; align-items:center; }
  main { padding:16px 20px 40px; max-width:1100px; margin:0 auto; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:14px; }
  .panel h2 { margin:0 0 12px; font-size:14px; color:var(--dim); }
  .authbox { max-width:400px; margin:60px auto; }
  .authbox .tabs { display:flex; gap:6px; margin-bottom:14px; }
  .authbox .tabs button { flex:1; }
  input, button, select { font:inherit; }
  input { width:100%; background:var(--bg); border:1px solid var(--line); color:var(--text); padding:8px 10px; border-radius:6px; margin-bottom:10px; }
  button { background:var(--accent); border:0; color:#fff; padding:7px 14px; border-radius:6px; cursor:pointer; font-size:13px; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--dim); }
  button.danger { background:transparent; border:1px solid var(--bad); color:var(--bad); }
  button:disabled { opacity:.4; cursor:default; }
  .err { color:var(--bad); font-size:12px; margin:6px 0; min-height:16px; }
  .okmsg { color:var(--ok); font-size:12px; margin:6px 0; word-break:break-all; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--dim); font-weight:500; }
  .meta { color:var(--dim); font-size:12px; }
  .badge { display:inline-block; padding:1px 8px; border-radius:10px; font-size:11px; background:var(--line); color:var(--dim); margin-right:4px; }
  .empty { color:var(--dim); text-align:center; padding:14px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .link { color:var(--accent); cursor:pointer; word-break:break-all; }
  pre.key { background:var(--bg); border:1px dashed var(--accent); border-radius:6px; padding:10px; word-break:break-all; user-select:all; }
  nav.tabs { display:flex; gap:4px; padding:10px 20px 0; }
  nav.tabs button { background:none; border:1px solid transparent; color:var(--dim); padding:6px 14px; border-radius:8px 8px 0 0; }
  nav.tabs button.active { color:var(--text); background:var(--panel); border-color:var(--line); }
</style>
</head>
<body>
<header>
  <h1>Maitian Hub · 门户</h1>
  <span class="sub" id="wsname"></span>
  <div class="right" id="userbox"></div>
</header>
<div id="app"></div>
<div class="toast" id="toast" style="position:fixed;right:20px;bottom:20px;background:var(--panel);border:1px solid var(--line);padding:10px 16px;border-radius:8px;display:none;"></div>
<script>
const $ = (s, el=document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const INVITE = new URLSearchParams(location.search).get('invite') || '';
let ME = null;

function toast(msg, ok=true) { const t=$('#toast'); t.textContent=msg; t.style.borderColor=ok?'var(--ok)':'var(--bad)'; t.style.display='block'; setTimeout(()=>t.style.display='none',4000); }
async function api(path, opts={}) {
  const o = { ...opts, headers: { ...(opts.headers||{}) } };
  if (o.body && !(o.body instanceof FormData) && typeof o.body !== 'string') { o.body = JSON.stringify(o.body); o.headers['content-type']='application/json'; }
  const r = await fetch(path, o);
  let j; try { j = await r.json(); } catch { j = { ok:false, error:'bad response' }; }
  if (r.status === 401 && ME) { ME = null; render(); }
  return { status: r.status, ...j };
}
function pwCheck(p) { return String(p||'').length >= 8 ? null : '密码至少 8 位'; }
function unCheck(u) { return /^[A-Za-z0-9_\-]{3,32}$/.test(u||'') ? null : '用户名 3-32 位（字母/数字/_/-）'; }

// ---------- 认证视图 ----------
function renderAuth(mode) {
  $('#userbox').innerHTML = '';
  $('#wsname').textContent = '';
  const inv = INVITE ? `<div class="meta">已检测到邀请链接：将加入邀请方的 workspace</div><input id="i-inv" value="${esc(INVITE)}" readonly>` : '';
  $('#app').innerHTML = `<div class="authbox panel">
    <div class="tabs"><button id="t-login">登录</button><button id="t-reg">注册</button></div>
    <div class="err" id="a-err"></div>
    ${mode==='reg' ? inv : ''}
    <input id="i-user" placeholder="邮箱或手机号" autocomplete="username">
    <input id="i-pass" type="password" placeholder="密码（≥8 位）" autocomplete="${mode==='reg'?'new-password':'current-password'}">
    ${mode==='reg' ? '<input id="i-pass2" type="password" placeholder="再次输入密码（两次需一致）">' : ''}
    <button id="a-go" style="width:100%">${mode==='reg' ? (INVITE?'加入该 workspace 并注册':'注册（创建我的 workspace）') : '登录'}</button>
    <div class="meta" style="margin-top:10px">注册即创建自己的 workspace（注册人=拥有者）；持邀请链接注册则加入对方 workspace。CLI 用「密钥管理」页的默认密钥连接。</div>
  </div>`;
  $('#t-login').onclick = () => renderAuth('login');
  $('#t-reg').onclick = () => renderAuth('reg');
  $('#a-go').onclick = async () => {
    const err = $('#a-err'); err.textContent = '';
    const account = $('#i-user').value.trim(), password = $('#i-pass').value;
    if (!account) { err.textContent = '请输入邮箱或手机号'; return; }
    if (mode === 'reg') {
      const e2 = pwCheck(password); if (e2) { err.textContent = e2; return; }
      if (password !== $('#i-pass2').value) { err.textContent = '两次输入的密码不一致'; return; }
      const invite = ($('#i-inv') && $('#i-inv').value.trim()) || '';
      const r = await api('/webapi/register', { method:'POST', body:{ account, password, password2: $('#i-pass2').value, invite_code: invite || undefined } });
      if (!r.ok) { err.textContent = r.error || '注册失败'; return; }
      ME = { username: r.account, role: r.role, tenant_id: r.tenant_id, tenant_name: r.tenant_name };
      showKeyOnce(r.api_key);
    } else {
      const r = await api('/webapi/login', { method:'POST', body:{ account, password } });
      if (!r.ok) { err.textContent = r.error || '登录失败'; return; }
      ME = { username: r.username, role: r.role, tenant_id: r.tenant_id, tenant_name: r.tenant_name };
    }
    render();
  };
}
function showKeyOnce(key) {
  $('#app').insertAdjacentHTML('afterbegin', `<div class="panel"><h2>你的默认 API 密钥（仅此一次显示，请立即复制保存）</h2><pre class="key">${esc(key)}</pre>
  <div class="meta">CLI 连接：在 hub 所在机器执行 <code>node src/hub.mjs join</code> 并粘贴此密钥。此页可随时新建更多密钥。</div>
  <button class="ghost" onclick="this.parentElement.remove()">我已保存</button></div>`);
}

// ---------- 主视图 ----------
function render() {
  if (!ME) return renderAuth(INVITE ? 'reg' : 'login');
  $('#userbox').innerHTML = `<span class="sub">${esc(ME.username)}（${ME.role==='owner'?'拥有者':'成员'}）</span><button class="ghost" id="b-logout">退出</button>`;
  $('#wsname').textContent = 'workspace：' + (ME.tenant_name || '');
  $('#b-logout').onclick = async () => { await api('/webapi/logout', { method:'POST', body:{} }); ME = null; render(); };
  $('#app').innerHTML = `<nav class="tabs">
      <button data-t="mat" class="active">素材库</button>
      <button data-t="keys">密钥管理</button>
      <button data-t="inv">邀请</button>
      <button data-t="mem">成员</button>
    </nav><main id="main"></main>`;
  $$('#app nav.tabs button').forEach((b) => b.onclick = () => {
    $$('#app nav.tabs button').forEach((x) => x.classList.remove('active')); b.classList.add('active'); renderTab(b.dataset.t);
  });
  renderTab('mat');
}
function renderTab(t) {
  const main = $('#main');
  if (t === 'mat') renderMaterials(main);
  else if (t === 'keys') renderKeys(main);
  else if (t === 'inv') renderInvite(main);
  else renderMembers(main);
}

async function renderMaterials(main) {
  main.innerHTML = '<div class="panel"><h2>素材库</h2><div class="row"><input id="f-q" placeholder="标题搜索…" style="max-width:260px"><select id="f-p" style="max-width:160px"></select><button id="f-go">查询</button></div><div id="f-list" class="empty">加载中…</div></div>';
  const sel = $('#f-p');
  for (const [code, name] of [['','全部平台'],['common','common'],['xhs','小红书'],['douyin','抖音'],['tiktok','TikTok'],['yt','YouTube'],['bili','B站'],['x','X'],['xianyu','闲鱼']]) {
    const o = document.createElement('option'); o.value = code; o.textContent = name || '全部平台'; sel.appendChild(o);
  }
  const load = async () => {
    const q = $('#f-q').value.trim(), p = $('#f-p').value;
    const r = await api(`/webapi/materials?limit=50${p?`&platform=${p}`:''}${q?`&q=${encodeURIComponent(q)}`:''}`);
    const list = $('#f-list');
    if (!r.ok) { list.className='err'; list.textContent = r.error || '加载失败'; return; }
    if (!r.items.length) { list.className='empty'; list.textContent = '暂无素材（用 hub 或 API 上传后这里可见）'; return; }
    list.className = '';
    list.innerHTML = '<table><tr><th>标题</th><th>类型</th><th>标签</th><th>大小</th><th>时间</th><th>使用记录</th><th>占用</th><th></th></tr>' +
      r.items.map((m) => `<tr><td>${esc(m.title)}</td><td><span class="badge">${esc(m.type)}</span></td><td>${m.tags.map((t)=>`<span class="badge">${esc(t)}</span>`).join('')}</td>
      <td class="meta">${(m.size/1024/1024).toFixed(2)}MB</td><td class="meta">${esc((m.created_at||'').slice(0,10))}</td>
      <td class="meta">${m.used_on.length ? m.used_on.map((u)=>`${esc(u.platform)}${u.url?' ✓':''}`).join('、') : '—'}</td>
      <td class="meta">${m.claimed_until && new Date(m.claimed_until) > new Date() ? '被 '+esc(m.claimed_by||'')+' 占用' : '空闲'}</td>
      <td><a href="/webapi/materials/${esc(m.id)}/file" target="_blank"><button class="ghost">下载</button></a></td></tr>`).join('');
  };
  $('#f-go').onclick = load; $('#f-q').onkeydown = (e) => { if (e.key === 'Enter') load(); };
  load();
}

async function renderKeys(main) {
  const r = await api('/webapi/me/keys');
  main.innerHTML = `<div class="panel"><h2>我的 API 密钥（CLI 用：node src/hub.mjs join 粘贴）</h2><div id="k-new"></div><div id="k-list"></div></div>`;
  const draw = (rows) => {
    $('#k-list').innerHTML = rows.length ? '<table><tr><th>名称</th><th>密钥</th><th>创建</th><th>最近使用</th><th>状态</th><th></th></tr>' +
      rows.map((k) => `<tr><td>${esc(k.name)}</td><td class="meta">${esc(k.key_hint||'')}</td><td class="meta">${esc((k.created_at||'').slice(0,10))}</td>
      <td class="meta">${k.last_used_at ? esc(k.last_used_at.slice(0,16)).replace('T',' ') : '从未'}</td>
      <td>${k.revoked_at ? '<span class="badge">已吊销</span>' : '<span class="badge" style="color:var(--ok)">有效</span>'}</td>
      <td>${k.revoked_at ? '' : `<button class="danger" data-id="${esc(k.id)}">吊销</button>`}</td></tr>`).join('') + '</table>'
      : '<div class="empty">暂无密钥</div>';
    $$('#k-list button.danger').forEach((b) => b.onclick = async () => {
      if (!confirm('吊销后使用该密钥的设备立即失联，确认？')) return;
      const rr = await api('/webapi/me/keys/' + b.dataset.id, { method:'DELETE', body:{} });
      toast(rr.ok ? '已吊销' : (rr.error||'失败'), rr.ok); renderKeys(main);
    });
  };
  draw(r.keys || []);
  $('#k-new').innerHTML = `<div class="row" style="margin-bottom:10px"><input id="k-name" placeholder="密钥名称（如：服务器hub / 张三-笔记本）" style="max-width:300px"><button id="k-create">新建密钥</button></div><div class="okmsg" id="k-out"></div>`;
  $('#k-create').onclick = async () => {
    const name = $('#k-name').value.trim() || '未命名密钥';
    const rr = await api('/webapi/me/keys', { method:'POST', body:{ name } });
    if (!rr.ok) { toast(rr.error||'创建失败', false); return; }
    $('#k-out').innerHTML = '新密钥（<b>仅此一次显示，立即复制</b>）：<pre class="key">' + esc(rr.api_key) + '</pre>';
    draw(rr.keys);
  };
}

async function renderInvite(main) {
  const r = await api('/webapi/me/invite');
  const link = r.invite_code ? `${location.origin}/web/register?invite=${encodeURIComponent(r.invite_code)}` : null;
  main.innerHTML = `<div class="panel"><h2>邀请加入本 workspace</h2>
    <div class="meta" style="margin-bottom:10px">把下面的链接发给对方：对方打开即进入本 workspace 的注册页（注册后成为成员，默认获得一把自己的 API 密钥）。${ME.role==='owner'?'':'（你是成员，也可邀请；owner 可移除成员）'}</div>
    ${link ? `<pre class="key">${esc(link)}</pre><div class="row"><button class="ghost" id="iv-copy">复制链接</button><button class="ghost" id="iv-new">重新生成</button><span class="meta">有效期 7 天，限 ${r.max_uses||1} 人使用，已用 ${r.used_count||0} 次</span></div>` : '<div class="empty">生成中…</div>'}
  </div>`;
  if (link) {
    $('#iv-copy').onclick = () => { navigator.clipboard.writeText(link).then(() => toast('已复制')); };
    $('#iv-new').onclick = async () => { await api('/webapi/me/invite', { method:'POST', body:{} }); renderInvite(main); };
  }
}

async function renderMembers(main) {
  const r = await api('/webapi/members');
  main.innerHTML = `<div class="panel"><h2>成员（workspace：${esc(ME.tenant_name||'')}）</h2><div id="m-list"></div></div>`;
  const rows = r.members || [];
  $('#m-list').innerHTML = rows.length ? '<table><tr><th>用户名</th><th>角色</th><th>密钥数</th><th>加入时间</th><th></th></tr>' +
    rows.map((u) => `<tr><td>${esc(u.username)}</td><td>${u.role==='owner'?'<span class="badge" style="color:var(--ok)">拥有者</span>':'<span class="badge">成员</span>'}</td>
    <td class="meta">${u.key_count}</td><td class="meta">${esc((u.created_at||'').slice(0,10))}</td>
    <td>${(ME.role==='owner' && u.role!=='owner') ? `<button class="danger" data-id="${esc(u.id)}">移除</button>` : ''}</td></tr>`).join('') + '</table>'
    : '<div class="empty">加载中…</div>';
  $$('#m-list button.danger').forEach((b) => b.onclick = async () => {
    if (!confirm('移除该成员？其全部 API 密钥将立即失效。')) return;
    const rr = await api('/webapi/members/' + b.dataset.id, { method:'DELETE', body:{} });
    toast(rr.ok ? '已移除' : (rr.error||'失败'), rr.ok); renderMembers(main);
  });
}

render();
</script>
</body>
</html>
