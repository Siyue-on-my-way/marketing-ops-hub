<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maitian Hub · 大屏</title>
<style>
  :root {
    --bg: #101318; --panel: #181d24; --line: #262d38; --text: #e6e9ee; --dim: #8b93a1;
    --accent: #4f8cff; --ok: #3fbf7f; --warn: #e0a83c; --bad: #e05c5c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  header { display: flex; align-items: baseline; gap: 16px; padding: 14px 20px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; margin: 0; }
  header .sub { color: var(--dim); font-size: 12px; }
  nav { display: flex; gap: 4px; padding: 10px 20px 0; }
  nav button { background: none; border: 1px solid transparent; border-bottom: none; color: var(--dim); padding: 6px 14px; border-radius: 8px 8px 0 0; cursor: pointer; font-size: 13px; }
  nav button.active { color: var(--text); background: var(--panel); border-color: var(--line); }
  main { padding: 16px 20px 40px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 14px; }
  .panel h2 { margin: 0 0 10px; font-size: 14px; color: var(--dim); font-weight: 600; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .card { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; min-width: 260px; flex: 1; }
  .card .t { font-weight: 600; margin-bottom: 4px; }
  .meta { color: var(--dim); font-size: 12px; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px; background: var(--line); color: var(--dim); }
  .badge.filled { background: rgba(224,168,60,.15); color: var(--warn); }
  .badge.published { background: rgba(79,140,255,.15); color: var(--accent); }
  .badge.executed, .badge.confirmed, .badge.active { background: rgba(63,191,127,.15); color: var(--ok); }
  .badge.cold { background: rgba(224,168,60,.15); color: var(--warn); }
  .badge.banned_watch, .badge.paused { background: rgba(224,92,92,.15); color: var(--bad); }
  button.act { background: var(--accent); border: 0; color: #fff; padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; }
  button.act.ghost { background: transparent; border: 1px solid var(--line); color: var(--dim); }
  button.act.danger { background: transparent; border: 1px solid var(--bad); color: var(--bad); }
  button.act:disabled { opacity: .4; cursor: default; }
  pre.payload { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px; font-size: 12px; white-space: pre-wrap; max-height: 180px; overflow: auto; }
  img.shot { max-width: 100%; border-radius: 6px; border: 1px solid var(--line); margin-top: 8px; display: block; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--dim); font-weight: 500; }
  .warnbox { color: var(--warn); font-size: 12px; margin-top: 4px; }
  .empty { color: var(--dim); padding: 18px 0; text-align: center; }
  .toast { position: fixed; right: 20px; bottom: 20px; background: var(--panel); border: 1px solid var(--line); padding: 10px 16px; border-radius: 8px; display: none; }
</style>
</head>
<body>
<header>
  <h1>Maitian Hub</h1>
  <span class="sub" id="now"></span>
  <span class="sub">人审最后一下 · 发布按钮永远由你亲手点（红线 1）</span>
</header>
<nav>
  <button data-tab="queue" class="active">待审队列</button>
  <button data-tab="proposals">进化提案</button>
  <button data-tab="calendar">排期日历</button>
  <button data-tab="health">账号健康</button>
  <button data-tab="audit">审计时间线</button>
</nav>
<main id="main"></main>
<div class="toast" id="toast"></div>

<script>
let STATE = null;
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// 访问令牌：?token=... 优先（并记住），其后取上次保存的；容器模式 SERVER_TOKEN 启用时必带
const TOKEN = (() => {
  const t = new URLSearchParams(location.search).get('token');
  if (t) { try { localStorage.setItem('mthub_token', t); } catch {} return t; }
  try { return localStorage.getItem('mthub_token') || ''; } catch { return ''; }
})();
const shotsUrl = (enc) => '/api/shots?f=' + enc + '&token=' + encodeURIComponent(TOKEN);

async function api(path, opts = {}) {
  const headers = { ...(opts.headers || {}) };
  if (TOKEN) headers['x-server-token'] = TOKEN;
  const r = await fetch(path, { ...opts, headers });
  if (r.status === 401) return { ok: false, error: '未授权：请带 ?token=<SERVER_TOKEN> 访问本页' };
  return r.json().catch(() => ({ ok: false, error: 'bad json' }));
}
function toast(msg, ok = true) {
  const t = $('#toast'); t.textContent = msg;
  t.style.borderColor = ok ? 'var(--ok)' : 'var(--bad)';
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 4000);
}

async function refresh() {
  STATE = await api('/api/state');
  $('#now').textContent = '数据时间 ' + new Date(STATE.now).toLocaleString();
  render();
}

function render() {
  const tab = $('.nav-active, nav button.active')?.dataset.tab || 'queue';
  const main = $('#main');
  if (tab === 'queue') renderQueue(main);
  else if (tab === 'proposals') renderProposals(main);
  else if (tab === 'calendar') renderCalendar(main);
  else if (tab === 'health') renderHealth(main);
  else renderAudit(main);
}

// 自进化提案人审（EVOLUTION-SPEC §2：AI 有提案权，人有一票否决权，approve 后 hub 才写 L2 配置）
function renderProposals(main) {
  const ps = STATE.proposals || [];
  const drafted = ps.filter((p) => p.status === 'drafted');
  const decided = ps.filter((p) => p.status !== 'drafted');
  let html = '<div class="panel"><h2>进化提案待审（策略库 / 知识包自愈 / 配额收紧——approve 后 hub 才写 L2 配置，version+1 生效）</h2>';
  if (!drafted.length) html += '<div class="empty">暂无待审提案（AI 周分析「生成策略报告」/「修复平台适配器」后产生）</div>';
  for (const p of drafted) {
    html += `<div class="card" style="margin-bottom:10px">
      <div class="row" style="justify-content:space-between;align-items:center">
        <div class="t">[${esc(p.kind)}${p.platform ? '·' + esc(p.platform) : ''}] ${esc((p.payload && p.payload.summary) || '')} <span class="badge filled">${esc(p.status)}</span></div>
        <div>
          <button class="act" onclick="approveProposal('${esc(p.id)}')">approve（生效）</button>
          <button class="act danger" onclick="rejectProposal('${esc(p.id)}')">reject</button>
        </div>
      </div>
      <div class="meta">提案 ${esc(p.id)} · ${esc(p.created_at || '')}${p.basis ? ' · 依据 ' + esc(p.basis) : ''}${p.account_id ? ' · 账号 ' + esc(p.account_id) : ''}</div>
      <pre class="payload">${esc(JSON.stringify(p.payload, null, 2))}</pre>
    </div>`;
  }
  html += '</div>';
  if (decided.length) {
    html += '<div class="panel"><h2>已裁决提案（留档：applied_version 可回溯，回滚=用 versions/ 归档覆盖）</h2><table><tr><th>提案</th><th>类型</th><th>平台/账号</th><th>状态</th><th>生效版本</th><th>裁决时间</th></tr>';
    for (const p of decided) {
      html += `<tr><td class="meta">${esc(p.id)}</td><td><span class="badge">${esc(p.kind)}</span></td><td class="meta">${esc(p.platform || p.account_id || '')}</td><td><span class="badge ${p.status === 'approved' ? 'confirmed' : ''}">${esc(p.status)}</span></td><td class="meta">${esc(p.applied_version == null ? '—' : 'v' + p.applied_version)}</td><td class="meta">${esc((p.decided_at || '').replace('T', ' ').slice(0, 19))}</td></tr>`;
    }
    html += '</table></div>';
  }
  main.innerHTML = html;
}

function renderQueue(main) {
  const posts = STATE.queue.posts, engs = STATE.queue.engagements;
  let html = '<div class="panel"><h2>发布待审（filled：请去平台亲手点发布，然后点「已发布，回读确认」）</h2>';
  if (!posts.length) html += '<div class="empty">暂无待审发布</div>';
  for (const p of posts) {
    const pl = p.adapted_payload || {};
    html += `<div class="card" style="margin-bottom:10px">
      <div class="row" style="justify-content:space-between;align-items:center">
        <div class="t">[${esc(p.platform)}] ${esc(pl.title || '(无标题)')} <span class="badge ${esc(p.status)}">${esc(p.status)}</span></div>
        <div>
          <button class="act" onclick="confirmPost('${esc(p.id)}')">已发布，回读确认</button>
          <button class="act ghost" onclick="toggleShot(this, '${encodeURIComponent(p.shot_filled || '')}')">查看填写截图</button>
        </div>
      </div>
      <div class="meta">账号 ${esc(p.display_name)} · 排期 ${esc(p.scheduled_at || '')} · post_id ${esc(p.id)}</div>
      <pre class="payload">${esc(JSON.stringify(pl, null, 2))}</pre>
      ${p.shot_filled ? `<img class="shot" src="${shotsUrl(encodeURIComponent(p.shot_filled || ''))}" style="display:none" data-shot>` : ''}
      <div class="meta" style="margin-top:4px">红线1：系统只填写，绝不代点发布；发布后点右侧确认，hub 回读平台后台核实。</div>
    </div>`;
  }
  html += '</div><div class="panel"><h2>互动待审（AI 草拟 → 你逐条 approve 后才执行）</h2>';
  if (!engs.length) html += '<div class="empty">暂无待审互动</div>';
  else {
    html += '<div style="margin-bottom:8px"><button class="act ghost" onclick="approveBatch()">批准今日全部草拟（红线8：仅今日批次）</button></div>';
    for (const e of engs) {
      html += `<div class="card" style="margin-bottom:8px">
        <div class="row" style="justify-content:space-between;align-items:center">
          <div class="t">[${esc(e.platform)}·${esc(e.display_name)}] ${esc(e.kind)} → <span class="meta">${esc(e.target)}</span></div>
          <div>
            <button class="act" onclick="approveEng('${esc(e.id)}')">approve</button>
            <button class="act danger" onclick="rejectEng('${esc(e.id)}')">reject</button>
          </div>
        </div>
        ${e.draft ? `<pre class="payload">${esc(e.draft)}</pre>` : ''}
      </div>`;
    }
  }
  html += '</div>';
  main.innerHTML = html;
}

function renderCalendar(main) {
  let html = '<div class="panel"><h2>排期与状态（近 100 条）</h2><table><tr><th>时间</th><th>平台</th><th>账号</th><th>状态</th><th>post</th></tr>';
  if (!STATE.calendar.length) html += '<tr><td colspan="5" class="empty">暂无排期</td></tr>';
  for (const c of STATE.calendar) {
    html += `<tr><td>${esc((c.scheduled_at || '').replace('T', ' ').slice(0, 16))}</td><td>${esc(c.platform)}</td><td>${esc(c.display_name)}</td><td><span class="badge ${esc(c.status)}">${esc(c.status)}</span></td><td class="meta">${esc(c.id)}</td></tr>`;
  }
  html += '</table></div>';
  main.innerHTML = html;
}

function renderHealth(main) {
  let html = '<div class="panel"><h2>账号健康（trust_score / 今日配额 / 登录态）</h2><div class="row">';
  if (!STATE.accounts.length) html += '<div class="empty">尚无账号，先 hub accounts add</div>';
  for (const a of STATE.accounts) {
    const q = a.quota, u = a.used;
    html += `<div class="card">
      <div class="t">[${esc(a.platform)}] ${esc(a.display_name)} <span class="badge ${esc(a.status)}">${esc(a.status)}</span></div>
      <div class="meta">trust ${Number(a.trust_score).toFixed(2)} · 风控 ${a.risk_events} 次 · 设备 ${esc(a.owner_device || '本机')}</div>
      <div class="meta">今日 post ${u.post}/${q.post} · like ${u.like}/${q.like} · comment ${u.comment}/${q.comment} · dm ${u.dm}/${q.dm}</div>
      <div class="meta">登录态: ${a.login.ok == null ? '未预检' : a.login.ok ? '✓ ' + esc(a.login.displayName || '') : '✗ 未登录'} ${a.cold_days_left ? '· 冷启动余 ' + a.cold_days_left + ' 天' : ''}</div>
    </div>`;
  }
  html += '</div></div>';
  main.innerHTML = html;
}

function renderAudit(main) {
  let html = '<div class="panel"><h2>审计时间线（最近 50 条）</h2><table><tr><th>时间</th><th>账号</th><th>动作</th><th>详情</th><th>截图</th></tr>';
  if (!STATE.audit.length) html += '<tr><td colspan="5" class="empty">暂无审计记录</td></tr>';
  for (const a of STATE.audit) {
    html += `<tr><td class="meta">${esc((a.ts || '').replace('T', ' ').slice(0, 19))}</td><td class="meta">${esc(a.account_id || '')}</td><td><span class="badge">${esc(a.action)}</span></td><td class="meta" style="max-width:420px;overflow-wrap:anywhere">${esc(a.detail || '')}</td><td>${a.shot ? `<button class="act ghost" onclick="toggleShot(this, '${encodeURIComponent(a.shot)}')">图</button>` : ''}</td></tr>`;
  }
  html += '</table></div>';
  main.innerHTML = html;
}

async function confirmPost(id) {
  if (!confirm('确认你已在该平台亲手点过「发布」？hub 将回读平台后台核实。')) return;
  toast('回读中…（最长约 1 分钟）');
  const r = await api('/api/posts/' + id + '/confirm', { method: 'POST' });
  toast(r.ok ? '已确认：' + (r.url || '回读通过') : '回读未通过：' + (r.error || '') + (r.hint ? ' / ' + r.hint : ''), r.ok);
  refresh();
}
async function approveEng(id) { await api('/api/engagements/' + id + '/approve', { method: 'POST' }); toast('已批准，守护进程将按拟人节奏执行'); refresh(); }
async function rejectEng(id) { await api('/api/engagements/' + id + '/reject', { method: 'POST' }); toast('已拒绝'); refresh(); }
async function approveProposal(id) {
  if (!confirm('批准该进化提案？approve 后 hub 写入 L2 配置（version+1 生效，旧版归档可回滚）。')) return;
  const r = await api('/api/proposals/' + id + '/approve', { method: 'POST' });
  toast(r.ok ? '已生效：' + (r.note || '') : '未生效：' + (r.error || ''), r.ok);
  refresh();
}
async function rejectProposal(id) { await api('/api/proposals/' + id + '/reject', { method: 'POST' }); toast('已拒绝（进化产物未落地）'); refresh(); }
async function approveBatch() {
  if (!confirm('批准今日全部草拟互动？（红线 8 允许，但请确认每条都过目了）')) return;
  const r = await api('/api/engagements/approve-batch', { method: 'POST' });
  toast('已批准 ' + (r.approved || 0) + ' 条'); refresh();
}
function toggleShot(btn, enc) {
  const img = btn.closest('.card, tr')?.querySelector('[data-shot]');
  const src = shotsUrl(enc);
  if (img) { img.style.display = img.style.display === 'none' ? 'block' : 'none'; if (img.style.display === 'block') img.src = src; }
  else {
    let img = btn.parentElement.parentElement.querySelector('img.shot');
    if (!img) { img = document.createElement('img'); img.className = 'shot'; btn.parentElement.parentElement.appendChild(img); }
    if (img.style.display === 'none') { img.style.display = 'block'; img.src = src; }
    else { img.style.display = 'none'; }
  }
}

$$('nav button').forEach((b) => b.addEventListener('click', () => {
  $$('nav button').forEach((x) => x.classList.remove('active'));
  b.classList.add('active');
  render();
}));
refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
