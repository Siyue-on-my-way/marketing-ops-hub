worker_processes 1;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  sendfile on;

  server {
    listen 80;

    # API → backend（hub 中控）。鉴权由 backend 的 SERVER_TOKEN 中间件执行（401）
    location /api/ {
      proxy_pass http://backend:8787;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 120s;   # confirm 回读等长动作
    }

    # 本项目无 WebSocket：/ws 段按模板说明删除

    # 其余 → frontend（大屏静态 + SPA 回退）
    location / {
      proxy_pass http://frontend:80;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
