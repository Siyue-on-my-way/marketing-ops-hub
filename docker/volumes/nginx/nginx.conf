worker_processes 1;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  sendfile on;

  server {
    listen 80;

    # 用户门户（注册/登录/素材台/密钥管理）→ maitian-cloud
    location / {
      proxy_pass http://maitian-cloud:8788;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      client_max_body_size 2g;
    }

    # 运营大屏（hub 待审队列等，管理员/本机用；SERVER_TOKEN 鉴权）→ frontend
    location /console/ {
      proxy_pass http://frontend:80/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # hub 大屏 API → backend（SERVER_TOKEN 鉴权，豁免 /api/health）
    location /api/ {
      proxy_pass http://backend:8787;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 120s;   # confirm 回读等长动作
    }

    # 云素材库 API（CLI 密钥通道）→ maitian-cloud
    location /v1/ {
      proxy_pass http://maitian-cloud:8788;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      client_max_body_size 2g;   # 视频素材上传
      proxy_read_timeout 300s;
    }

    # 本项目无 WebSocket：/ws 段按模板说明删除
  }
}
