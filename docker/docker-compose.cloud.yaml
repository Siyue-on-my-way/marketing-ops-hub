# maitian-cloud 独立部署（生产推荐：云素材库单独一台服务器，hub 所在机器经 MAITIAN_CLOUD_URL 访问）
#
#   cd docker
#   MAITIAN_WORKSPACE_KEY='<长随机串>' docker compose -f docker-compose.cloud.yaml up -d --build
#
# 建议公网部署时前置 HTTPS + IP 白名单（规格 §4.1 安全边界：key=全部权限）。
services:
  maitian-cloud:
    build:
      context: ../backend
      additional_contexts:
        knowledge: ../content-hub
    command: ["node", "cloud/server.mjs"]
    ports:
      - "${CLOUD_PORT:-8788}:8788"
    environment:
      - PORT=8788
      - MAITIAN_WORKSPACE_KEY=${MAITIAN_WORKSPACE_KEY:?请先设置 MAITIAN_WORKSPACE_KEY}
      - MAITIAN_SIGN_SECRET=${MAITIAN_SIGN_SECRET:-}
      - MAITIAN_DATA_DIR=/data
    volumes:
      - ./volumes/marketing-ops-hub/cloud-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8788/v1/ping').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    cap_drop: [ALL]
    restart: unless-stopped
